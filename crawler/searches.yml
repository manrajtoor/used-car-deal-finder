# Searches the scheduled crawl runs (GitHub Actions .github/workflows/crawl.yml
# and scripts/crawl-and-push.ps1). Edit freely; the crawler checks this file
# and refuses unknown keys, so a typo cannot silently drop a filter.
#
#   go run ./cmd/carbuyer --searches searches.yml --no-score      # dry run, local SQLite only
#
# Politeness is built in: searches run one after another, one request at a
# time, at least `delaySeconds` apart (never less than 1.5 s), with a normal
# browser User-Agent, and the run stops at the first error.
# Keep it small: every run fetches about (searches x pages) pages, plus a few
# per site (Facebook: `pages` requests per city, Craigslist: up to 20 ad pages,
# CarGurus: `pages` per model year). This file is about 70 requests, ~4 min.
#
# `source` picks the site: autohebdo (default), kijiji, lespac, facebook,
# craigslist, cargurus. The sites that walk a whole region (kijiji, lespac,
# craigslist, cargurus) take no make/model. The most fragile sites go last,
# because the run stops at the first error.

delaySeconds: 3

# Applied to every search unless the search sets its own value.
defaults:
  seller: any        # any | dealer | private
  maxPrice: 30000    # price cap in USD
  pages: 1
  newest: true       # newest listings first: new deals show up on page 1

# New York tri-state: Craigslist. AutoHebdo, Kijiji and LesPAC are Canadian;
# CarGurus refuses automated requests (HTTP 406, checked 2026-09-30). Odometers are miles
# on the site; the crawler stores km. Each area is one feed request plus up to
# 20 ad pages (~21 requests, ~1 min at 3 s), so the seven areas take ~8 min: a
# run every 5 minutes then waits for the one before (concurrency: crawl).
# "newyork" alone has ~3 700 cars, more than one 360-car feed page, so each run
# sees the newest 360; sold cars are retired by the Worker's 14-day expiry.
searches:
  - source: craigslist
    geo: newyork          # 5 boroughs, Long Island, Westchester, Fairfield CT, Jersey City
  - source: craigslist
    geo: newjersey        # north Jersey
  - source: craigslist
    geo: longisland
  - source: craigslist
    geo: cnj              # central Jersey
  - source: craigslist
    geo: jerseyshore
  - source: craigslist
    geo: hudsonvalley     # Westchester north to Poughkeepsie
  - source: craigslist
    geo: newhaven         # CT; Fairfield County is inside "newyork"
  # Facebook Marketplace is in searches-facebook.yml: it refuses GitHub's
  # runners (all requests blocked from Actions, fine from a home connection).

